server {
    listen 80;
    listen [::]:80;
    server_name kinstock.io www.kinstock.io 64.110.107.153 _;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Client Max Body Size (Large File Upload Support)
    client_max_body_size 50M;

    # 1. FastAPI API Reverse Proxy
    location /api/ {
        proxy_pass http://fastapi-backend:8000/api/;
        proxy_http_version 1.1;
        
        # Proxy Headers for CORS & Real Client IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. FastAPI Swagger UI & OpenAPI Schema Routing
    location /docs {
        proxy_pass http://fastapi-backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://fastapi-backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Flutter Web Static Assets & SPA Routing
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Cache control for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Do not cache index.html or service worker for immediate SPA updates
        location ~* (index\.html|flutter_service_worker\.js)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
