version: '3.8'

networks:
  kinstock-network:
    driver: bridge

volumes:
  neo4j_data:
    driver: local

services:
  # ----------------------------------------------------
  # 1. Nginx Reverse Proxy (Frontend SPA + API Gateway)
  # ----------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: kinstock-nginx
    restart: always
    networks:
      - kinstock-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/build/web:/usr/share/nginx/html:ro
    depends_on:
      fastapi-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------
  # 2. FastAPI Clean Architecture Backend
  # ----------------------------------------------------
  fastapi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kinstock-backend:latest
    container_name: kinstock-backend
    restart: always
    networks:
      - kinstock-network
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=kinstock2024!
      - DART_API_KEY=${DART_API_KEY:-}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/themes')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------
  # 3. Neo4j Graph DB (ARM64 Optimized for Oracle VM)
  # ----------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: kinstock-neo4j
    restart: always
    networks:
      - kinstock-network
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/kinstock2024!
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - ./data/neo4j/import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
