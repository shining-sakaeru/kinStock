version: '3.8'

networks:
  themagraph-network:
    driver: bridge

volumes:
  neo4j_data:
    driver: local

services:
  # ----------------------------------------------------
  # 1. Neo4j Graph DB (ARM64 Optimized for Oracle VM)
  # ----------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: kinstock-neo4j
    networks:
      - themagraph-network
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/kinstock2024!
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - ./data/neo4j/import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ----------------------------------------------------
  # 2. FastAPI Clean Architecture Backend & Web Host
  # ----------------------------------------------------
  fastapi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kinstock-backend
    networks:
      - themagraph-network
    ports:
      - "8000:8000"
      - "80:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=kinstock2024!
      - DART_API_KEY=${DART_API_KEY:-}
    volumes:
      - ./frontend/build/web:/frontend/build/web:ro
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/themes')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------
  # 3. Cloudflare Quick Tunnel (Public HTTPS URL)
  # ----------------------------------------------------
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: kinstock-cloudflare-tunnel
    networks:
      - themagraph-network
    command: tunnel --protocol http2 --no-autoupdate --url http://fastapi-backend:8000
    depends_on:
      fastapi-backend:
        condition: service_healthy
    restart: unless-stopped
