name: KinStock Production CI/CD (GitHub Actions to Oracle VM)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kinstock-backend

jobs:
  # ----------------------------------------------------
  # Job 1: Test, Multi-Arch Image Build & GHCR Push
  # ----------------------------------------------------
  build-and-push:
    name: Build Multi-Arch Docker & Flutter Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Backend Pytest
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Run Backend Tests
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
          PYTHONPATH=. pytest tests

      # 2. Flutter Web Build & Test
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web Release
        working-directory: ./frontend
        run: |
          flutter pub get
          flutter test
          flutter build web --release --pwa-strategy=none

      # 3. Docker Multi-Arch Setup (QEMU & Buildx)
      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name for Docker Tag
        id: string
        run: |
          echo "IMAGE_TAG=$(echo ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & Push Backend Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.string.outputs.IMAGE_TAG }}:latest
            ${{ steps.string.outputs.IMAGE_TAG }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------
  # Job 2: Remote Deployment via appleboy/ssh-action
  # ----------------------------------------------------
  deploy:
    name: Deploy to Oracle Cloud ARM64 VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter for Web Sync
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Compile Flutter Web
        working-directory: ./frontend
        run: |
          flutter pub get
          flutter build web --release --pwa-strategy=none

      - name: Transfer Web Build & Config to Oracle VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          source: "frontend/build/web/*,nginx/default.conf,docker-compose.yml"
          target: "~/kinStock"

      - name: Execute Remote Deployment on Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          script_stop: true
          script: |
            cd ~/kinStock
            sudo docker compose pull || true
            sudo docker compose up -d --build --remove-orphans
            sudo docker image prune -f
            echo "✅ KinStock Nginx + FastAPI + Neo4j Deployment Complete on Oracle VM!"
